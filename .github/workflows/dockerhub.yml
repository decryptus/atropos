name: Docker Hub image
on:
  pull_request:
  push:
    branches: [main, release/dockerhub]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested stable image to Docker Hub
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dockerhub-atropos
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication guards
        run: |
          python scripts/check-test-collection.py docker/tests
          python -m unittest discover -s docker/tests -v
      - name: Read package identity
        id: identity
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + version, file=output)
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Build the Linux amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: atropos:test
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=atropos
          cache-to: type=gha,mode=max,scope=atropos
      - name: Test the installed image and durable state
        run: python docker/check-image.py
      - name: Record tested image identity
        run: |
          mkdir -p image-evidence
          docker image inspect atropos:test > image-evidence/image.json
          docker run --rm --network none --read-only --entrypoint cat atropos:test /usr/local/share/atraxis/environment.json > image-evidence/environment.json
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-evidence
          path: image-evidence/
          retention-days: 14
      - name: Check Docker Hub credential availability
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure DOCKERHUB_TOKEN for this repository.'; exit 1; }
      - name: Log in to Docker Hub
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        uses: docker/login-action@v4
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact tested image
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        run: python docker/release.py atropos --image atropos:test
