name: Docker Hub image
on:
  pull_request:
  push:
    branches: [main, release/dockerhub]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested stable image to Docker Hub
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dockerhub-atropos
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check publication guards
        run: |
          python scripts/check-test-collection.py docker/tests
          python -m unittest discover -s docker/tests -v
      - name: Read package identity
        id: identity
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + version, file=output)
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Linux amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: atropos:test
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=atropos
          cache-to: type=gha,mode=max,scope=atropos
      - name: Test the installed image and durable state
        run: python docker/check-image.py
      - name: Record tested image identity
        run: |
          mkdir -p image-evidence
          docker image inspect atropos:test > image-evidence/image.json
          docker run --rm --network none --read-only --entrypoint cat atropos:test /usr/local/share/atraxis/environment.json > image-evidence/environment.json
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image-evidence
          path: image-evidence/
          retention-days: 14
      - name: Check Docker Hub credential availability
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure DOCKERHUB_TOKEN for this repository.'; exit 1; }
      - name: Log in to Docker Hub
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact tested image
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        run: python docker/release.py atropos --image atropos:test
      - name: Verify published Linux amd64 image and installed behavior
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/dockerhub')
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          ref="decryptus/atropos:$VERSION"
          tested=$(docker image inspect --format '{{.Id}}' atropos:test)
          docker pull --platform linux/amd64 "$ref"
          test "$(docker image inspect --format '{{.Id}}' "$ref")" = "$tested"
          docker image inspect --format '{{index .RepoDigests 0}}' "$ref"
          docker tag "$ref" atropos:test
          python docker/check-image.py
