name: Engine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install disposable-test Redis binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
      - run: python -m pip install '.[redis,zen,exchange]'
      - run: python scripts/check-test-collection.py tests
      - run: python -m unittest discover -s tests -v
