name: Publish existing Atropos 1.0.0 to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atropos-pypi-1.0.0
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      client: ${{ steps.plan.outputs.client }}
      engine: ${{ steps.plan.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the reviewed main tree and successful promotion validation
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const main = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data;
            if (main.commit.sha !== context.sha) throw new Error('Current main required');
            const pulls = (await github.rest.repos.listPullRequestsAssociatedWithCommit({...repo, commit_sha: context.sha})).data;
            const merged = pulls.filter(p => p.merged_at && p.merge_commit_sha === context.sha && p.base.ref === 'main');
            if (merged.length !== 1) throw new Error('Reviewed merge required');
            const head = merged[0].head.sha;
            const commit = (await github.rest.git.getCommit({...repo, commit_sha: head})).data;
            if (commit.tree.sha !== main.commit.commit.tree.sha) throw new Error('Reviewed tree differs');
            const runs = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'pypi-validation.yml', head_sha: head, event: 'pull_request', per_page: 10})).data.workflow_runs;
            const latest = runs.sort((a,b) => b.id-a.id)[0];
            if (!latest || latest.conclusion !== 'success' || latest.head_sha !== head) throw new Error('Promotion validation required');
      - name: Recheck the original assets and current registry contents
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --repo decryptus/atropos --dir pypi-source
          gh api repos/decryptus/atropos/releases/tags/v1.0.0 > pypi-release.json
          gh api repos/decryptus/atropos/git/ref/tags/v1.0.0 > pypi-tag.json
          python scripts/prepare-pypi.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('pypi-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for role, files in plan['pending_uploads'].items():
                  output.write(f'{role}={len(files)}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.client != '0' || steps.plan.outputs.engine != '0'
        with:
          name: verified-pypi-uploads
          path: pypi-upload/
          if-no-files-found: error
          retention-days: 7
  publish-client:
    needs: prepare
    if: needs.prepare.outputs.client != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-uploads
          path: pypi-upload
      - name: Publish the independent client first
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: pypi-upload/client/
  publish-engine:
    needs: [prepare, publish-client]
    if: always() && needs.prepare.result == 'success' && (needs.publish-client.result == 'success' || needs.publish-client.result == 'skipped') && needs.prepare.outputs.engine != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-uploads
          path: pypi-upload
      - name: Publish the engine
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: pypi-upload/engine/
  verify:
    needs: [prepare, publish-client, publish-engine]
    if: always() && needs.prepare.result == 'success' && (needs.publish-client.result == 'success' || needs.publish-client.result == 'skipped') && (needs.publish-engine.result == 'success' || needs.publish-engine.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify registry bytes and installation from PyPI
        run: |
          python scripts/prepare-pypi.py --verify-registry
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmagic1
          python -m venv "$RUNNER_TEMP/from-pypi"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/from-pypi/bin/pip" install --index-url https://pypi.org/simple 'atraxis-atropos[service]==1.0.0' 'atropos-client[observations]==1.0.0'
          "$RUNNER_TEMP/from-pypi/bin/pip" check
          "$RUNNER_TEMP/from-pypi/bin/python" -c 'from importlib.metadata import version; assert version("atraxis-atropos") == version("atropos-client") == "1.0.0"'
          "$RUNNER_TEMP/from-pypi/bin/atropos" --help
