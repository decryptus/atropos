# Starting point for a dedicated local development instance, not a deployment.
bind 127.0.0.1
protected-mode yes
port 6379
# Provision this path as a durable volume owned by the Redis service user.
dir /var/lib/redis
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
# Configure authentication, TLS, memory sizing and backup/restore for your host.
# Do not expose an unauthenticated Redis instance to other hosts.
