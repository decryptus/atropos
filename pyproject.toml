[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atraxis-atropos"
version = "1.0.0"
description = "Durable rule and workflow engine for the Atraxis ecosystem"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "sonicprobe==0.3.62"]

[project.optional-dependencies]
postgresql = ["psycopg2-binary>=2.9,<3"]
mysql = ["mysqlclient>=2.2.4,<3"]
redis = ["redis>=5,<6"]
auton = ["auton==1.3.1"]
service = ["httpdis==0.6.34", "atropos-client[observations]==1.0.0", "zen-engine==2.1.2"]
zen = ["zen-engine==2.1.2"]
exchange = ["PyJWT[crypto]==2.15.1"]

[project.scripts]
atropos = "atropos.cli:main"

[tool.setuptools.packages.find]
include = ["atropos*"]
